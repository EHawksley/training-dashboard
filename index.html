<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Training">
  <meta name="format-detection" content="telephone=no">
  <title>Training</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    (function () {
      var path = location.pathname;
      if (!path.endsWith("/") && !/\.[a-z0-9]+$/i.test(path)) {
        location.replace(path + "/" + location.search + location.hash);
      }
    })();
  </script>
</head>
<body>
  <div class="app">
    <main id="view">
      <p class="loading">Loading training log…</p>
    </main>
    <nav class="tabbar" aria-label="Sections">
      <a href="#/progress" data-tab="progress">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M4 16.5 9 11l3 3 7.5-8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M15 6h5.5V11.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Progress</span>
      </a>
      <a href="#/calendar" data-tab="calendar">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M4 9.5h16M8 3.5v3M16 3.5v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Calendar</span>
      </a>
      <a href="#/recent" data-tab="recent">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M5 7h14M5 12h14M5 17h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Recent</span>
      </a>
    </nav>
  </div>
  <noscript><p class="loading">Training needs JavaScript to read the log.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
